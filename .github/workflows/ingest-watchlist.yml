# Refreshes just the watchlist tickers - the smallest, fastest scope.
#
# (Re-committed to make GitHub re-index this workflow after the repo was
# switched from private to public - Actions doesn't always pick up
# workflow files retroactively without a new push.)
#
# Runs every 30 minutes, but only Monday-Friday and only roughly 00:00-21:59
# UTC. That window comfortably covers all five target markets' trading
# hours (Singapore/Hong Kong/Taiwan/China open first, then Europe, then the
# US, which closes around 20:00-21:00 UTC depending on daylight saving) plus
# some buffer, without wasting runs at 2am UTC on a Sunday when nothing is
# trading anywhere.
#
# Tip: on a PUBLIC GitHub repo, Actions minutes are unlimited on the free
# plan. On a private repo, the free plan has a monthly minutes cap - keep
# that in mind if you fork this and go private.
name: Ingest - Watchlist

on:
  schedule:
    - cron: "*/30 0-21 * * 1-5"
  workflow_dispatch: {} # lets you click "Run workflow" in the GitHub UI to trigger it manually

permissions:
  contents: read

jobs:
  ingest-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the watchlist ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingest.run --scope watchlist
